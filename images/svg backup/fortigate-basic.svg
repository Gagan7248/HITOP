
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="338" viewBox="0 0 600 338">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101828"/>
      <stop offset="100%" stop-color="#1D2939"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="338" rx="18" fill="url(#bg)"/>

  <!-- Accent -->
  <rect x="32" y="32" width="5" height="42" rx="2.5" fill="#F04438"/>

  <!-- Category -->
  <text x="51" y="49" font-family="Arial, sans-serif"
        font-size="13" font-weight="700" letter-spacing="2"
        fill="#F97066">NETWORKING TUTORIAL</text>

  <!-- Title -->
  <text x="32" y="112" font-family="Arial, sans-serif"
        font-size="34" font-weight="700" fill="#FFFFFF">
    FortiGate
  </text>
  <text x="32" y="151" font-family="Arial, sans-serif"
        font-size="27" font-weight="600" fill="#D0D5DD">
    Basic Configuration
  </text>

  <!-- Firewall icon -->
  <g transform="translate(32 183)">
    <rect width="536" height="78" rx="12"
          fill="#344054" stroke="#475467"/>

    <rect x="16" y="17" width="128" height="44" rx="6"
          fill="#101828" stroke="#667085"/>

    <g fill="#F97066">
      <rect x="26" y="26" width="23" height="7" rx="2"/>
      <rect x="53" y="26" width="23" height="7" rx="2"/>
      <rect x="80" y="26" width="23" height="7" rx="2"/>
      <rect x="107" y="26" width="23" height="7" rx="2"/>
    </g>
    <g fill="#12B76A">
      <circle cx="31" cy="46" r="3"/>
      <circle cx="43" cy="46" r="3"/>
      <circle cx="55" cy="46" r="3"/>
    </g>

    <!-- Firewall symbol -->
    <path d="M176 25 L192 19 L208 25 V39
             C208 50 200 56 192 60
             C184 56 176 50 176 39 Z"
          fill="#F04438"/>
    <path d="M184 39 L190 45 L201 32"
          fill="none" stroke="#FFFFFF" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Network labels -->
    <g font-family="Arial, sans-serif" text-anchor="middle">
      <text x="282" y="34" font-size="12" fill="#98A2B3">WAN</text>
      <text x="282" y="52" font-size="14" font-weight="700" fill="#FFFFFF">Internet</text>
      <path d="M333 39 H365" stroke="#98A2B3"
            stroke-width="2" stroke-linecap="round"/>
      <path d="M359 33 L366 39 L359 45" fill="none"
            stroke="#98A2B3" stroke-width="2"/>
      <text x="431" y="34" font-size="12" fill="#98A2B3">LAN</text>
      <text x="431" y="52" font-size="14" font-weight="700" fill="#FFFFFF">Internal</text>
    </g>
  </g>

  <!-- Footer -->
  <circle cx="38" cy="293" r="4" fill="#12B76A"/>
  <text x="50" y="298" font-family="Arial, sans-serif"
        font-size="13" fill="#D0D5DD">
    Interfaces  •  Firewall Policy  •  NAT
  </text>

  <text x="568" y="298" font-family="Arial, sans-serif"
        font-size="11" text-anchor="end" fill="#98A2B3">
    01
  </text>
</svg>
