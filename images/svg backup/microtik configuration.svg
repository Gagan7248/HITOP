
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101923"/>
      <stop offset="100%" stop-color="#1b3040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="720" rx="24" fill="url(#grid)"/>
  <circle cx="1000" cy="330" r="250" fill="#f97316" opacity=".055"/>

  <!-- Category badge -->
  <rect x="72" y="72" width="280" height="46" rx="23"
        fill="#39271d" stroke="#fb923c" stroke-opacity=".75"/>
  <circle cx="97" cy="95" r="6" fill="#fb923c"/>
  <text x="116" y="102" font-family="Arial, sans-serif"
        font-size="18" font-weight="700" letter-spacing="2"
        fill="#fdba74">NETWORKING TUTORIAL</text>

  <!-- Main title -->
  <text x="72" y="225" font-family="Arial, sans-serif"
        font-size="79" font-weight="900" fill="#ffffff">MikroTik</text>
  <text x="72" y="310" font-family="Arial, sans-serif"
        font-size="58" font-weight="900" fill="url(#accent)">BASIC</text>
  <text x="72" y="380" font-family="Arial, sans-serif"
        font-size="58" font-weight="900" fill="url(#accent)">CONFIGURATION</text>

  <rect x="77" y="407" width="130" height="6" rx="3" fill="#fb923c"/>

  <text x="78" y="457" font-family="Arial, sans-serif"
        font-size="24" font-weight="700" fill="#e2e8f0">
    Router Setup for Beginners
  </text>
  <text x="78" y="495" font-family="Arial, sans-serif"
        font-size="21" fill="#b6c6d6">
    IP Address • DHCP • Internet Access
  </text>

  <!-- Configuration terminal -->
  <g transform="translate(78 535)">
    <rect width="490" height="90" rx="12"
          fill="#0a121b" stroke="#526474" stroke-width="2"/>
    <path d="M0 32H490" stroke="#526474" stroke-width="2"/>
    <circle cx="20" cy="16" r="5" fill="#fb7185"/>
    <circle cx="39" cy="16" r="5" fill="#fbbf24"/>
    <circle cx="58" cy="16" r="5" fill="#4ade80"/>
    <text x="20" y="57" font-family="monospace"
          font-size="17" fill="#fdba74">[admin@MikroTik] &gt;</text>
    <text x="20" y="79" font-family="monospace"
          font-size="15" fill="#4ade80">/ip address print</text>
  </g>

  <!-- Network connection lines -->
  <g fill="none" stroke="#fb923c" stroke-width="3" opacity=".8">
    <path d="M930 270L810 190"/>
    <path d="M1015 270L1130 190"/>
    <path d="M930 385L810 470"/>
    <path d="M1015 385L1130 470"/>
    <path d="M972 245V155"/>
  </g>

  <!-- Network endpoint icons -->
  <g stroke="#7dd3fc" stroke-width="3" stroke-linejoin="round">
    <!-- Internet cloud -->
    <g transform="translate(915 90)" fill="#17394c">
      <path d="M22 60H103A24 24 0 0 0 103 12
               A35 35 0 0 0 38 20
               A22 22 0 0 0 22 60Z"/>
      <path d="M52 39H83 M67 25V53" fill="none"
            stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- LAN computer -->
    <g transform="translate(750 145)" fill="#17394c">
      <rect width="83" height="55" rx="6"/>
      <rect x="8" y="8" width="67" height="37" rx="2" fill="#0e7490"/>
      <path d="M41 55V66 M24 66H58" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Wi-Fi client -->
    <g transform="translate(1100 145)" fill="#17394c">
      <rect width="66" height="55" rx="8"/>
      <path d="M13 22Q33 2 53 22 M20 29Q33 16 46 29"
            fill="none" stroke="#fb923c" stroke-width="3"
            stroke-linecap="round"/>
      <circle cx="33" cy="36" r="3" fill="#fb923c" stroke="none"/>
    </g>

    <!-- Laptop -->
    <g transform="translate(750 465)" fill="#17394c">
      <rect width="83" height="53" rx="5"/>
      <rect x="7" y="7" width="69" height="36" rx="2" fill="#0e7490"/>
      <path d="M-8 57H91L83 65H0Z"/>
    </g>

    <!-- Server -->
    <g transform="translate(1100 455)" fill="#17394c">
      <rect width="66" height="74" rx="6"/>
      <rect x="8" y="8" width="50" height="16" rx="2" fill="#0e7490"/>
      <rect x="8" y="29" width="50" height="16" rx="2" fill="#0e7490"/>
      <rect x="8" y="50" width="50" height="16" rx="2" fill="#0e7490"/>
      <circle cx="16" cy="16" r="3" fill="#4ade80" stroke="none"/>
      <circle cx="16" cy="37" r="3" fill="#4ade80" stroke="none"/>
      <circle cx="16" cy="58" r="3" fill="#4ade80" stroke="none"/>
    </g>
  </g>

  <!-- Router body -->
  <g transform="translate(840 260)">
    <!-- Antennas -->
    <path d="M42 18L20 -48 M180 18L202 -48"
          stroke="#d1d5db" stroke-width="9" stroke-linecap="round"/>
    <path d="M42 18L20 -48 M180 18L202 -48"
          stroke="#64748b" stroke-width="3" stroke-linecap="round"/>

    <!-- Router top -->
    <path d="M0 42L40 12H200L240 42Z"
          fill="#526170" stroke="#8493a3" stroke-width="2"/>
    <!-- Router front -->
    <rect x="0" y="42" width="240" height="105" rx="9"
          fill="#303d4a" stroke="#8493a3" stroke-width="3"/>
    <path d="M10 53H230" stroke="#667687" stroke-width="2"/>

    <!-- Router vents -->
    <g stroke="#111c27" stroke-width="4" stroke-linecap="round">
      <path d="M20 76V121 M30 76V121 M40 76V121"/>
      <path d="M50 76V121 M60 76V121 M70 76V121"/>
    </g>

    <!-- Ethernet ports -->
    <g fill="#0c1620" stroke="#8a9aab" stroke-width="2">
      <rect x="91" y="76" width="27" height="25" rx="2"/>
      <rect x="124" y="76" width="27" height="25" rx="2"/>
      <rect x="157" y="76" width="27" height="25" rx="2"/>
      <rect x="190" y="76" width="27" height="25" rx="2"/>
    </g>

    <!-- Status lights -->
    <g fill="#4ade80" filter="url(#glow)">
      <circle cx="101" cy="116" r="4"/>
      <circle cx="134" cy="116" r="4"/>
      <circle cx="167" cy="116" r="4"/>
      <circle cx="200" cy="116" r="4"/>
    </g>

    <text x="92" y="139" font-family="Arial, sans-serif"
          font-size="12" font-weight="700" fill="#e2e8f0">ROUTER</text>
  </g>

  <!-- Small connection nodes -->
  <g fill="#fb923c" filter="url(#glow)">
    <circle cx="930" cy="270" r="6"/>
    <circle cx="1015" cy="270" r="6"/>
    <circle cx="930" cy="385" r="6"/>
    <circle cx="1015" cy="385" r="6"/>
    <circle cx="972" cy="155" r="6"/>
  </g>

  <!-- Footer -->
  <path d="M72 650H1208" stroke="#94a3b8" stroke-opacity=".25"/>
  <text x="75" y="688" font-family="Arial, sans-serif"
        font-size="23" font-weight="800" letter-spacing="3"
        fill="#fb923c">HITOP</text>
  <text x="1205" y="687" text-anchor="end"
        font-family="Arial, sans-serif" font-size="18"
        fill="#b6c6d6">CONFIGURE • CONNECT • MANAGE</text>
</svg>
