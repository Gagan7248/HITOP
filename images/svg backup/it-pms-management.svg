
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">IT SOPs – Antivirus &amp; USB Management</title>
  <desc id="desc">Antivirus protection, malware prevention, and secure USB device management.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#123c52"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="80" r="190" fill="#38bdf8" opacity=".07"/>
  <circle cx="160" cy="570" r="200" fill="#2dd4bf" opacity=".06"/>

  <g stroke="#b8e6f5" opacity=".08">
    <path d="M0 100H1200 M0 200H1200 M0 300H1200 M0 400H1200 M0 500H1200"/>
    <path d="M100 0V630 M200 0V630 M300 0V630 M400 0V630 M500 0V630"/>
  </g>

  <!-- Heading -->
  <rect x="64" y="70" width="8" height="110" rx="4" fill="url(#accent)"/>

  <text x="98" y="105" fill="#5eead4" font-family="Arial,sans-serif"
        font-size="21" font-weight="700" letter-spacing="3">HOTEL IT OPERATIONS</text>

  <text x="94" y="170" fill="#ffffff" font-family="Arial,sans-serif"
        font-size="43" font-weight="700">Antivirus &amp;</text>
  <text x="94" y="225" fill="#ffffff" font-family="Arial,sans-serif"
        font-size="43" font-weight="700">USB Management</text>

  <text x="98" y="275" fill="#c4d6e5" font-family="Arial,sans-serif"
        font-size="20">Protection • Scanning • Device Control</text>

  <!-- Security status -->
  <rect x="94" y="326" width="410" height="66" rx="12"
        fill="#102c40" stroke="#28566a"/>
  <circle cx="125" cy="359" r="9" fill="#2dd4bf"/>
  <text x="149" y="367" fill="#e0f2fe" font-family="Arial,sans-serif"
        font-size="19" font-weight="600">ENDPOINT SECURITY</text>

  <!-- Security dashboard -->
  <rect x="635" y="105" width="475" height="330" rx="22"
        fill="#10253a" stroke="#4b7890" stroke-width="3"/>
  <rect x="655" y="125" width="435" height="48" rx="10" fill="#183d52"/>

  <circle cx="677" cy="149" r="5" fill="#fb7185"/>
  <circle cx="695" cy="149" r="5" fill="#fbbf24"/>
  <circle cx="713" cy="149" r="5" fill="#2dd4bf"/>

  <text x="740" y="156" fill="#e0f2fe" font-family="Arial,sans-serif"
        font-size="18" font-weight="700">SECURITY CONTROL CENTER</text>

  <!-- Antivirus card -->
  <rect x="674" y="194" width="188" height="95" rx="12"
        fill="#173c50" stroke="#2d6172"/>
  <text x="692" y="222" fill="#a5c9d9" font-family="Arial,sans-serif"
        font-size="15">ANTIVIRUS</text>
  <path d="M696 249l9 9 17-19" fill="none" stroke="#5eead4"
        stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="731" y="258" fill="#5eead4" font-family="Arial,sans-serif"
        font-size="17" font-weight="700">PROTECTED</text>

  <!-- USB control card -->
  <rect x="878" y="194" width="190" height="95" rx="12"
        fill="#173c50" stroke="#2d6172"/>
  <text x="897" y="222" fill="#a5c9d9" font-family="Arial,sans-serif"
        font-size="15">USB DEVICES</text>
  <rect x="902" y="239" width="28" height="28" rx="5"
        fill="#0c293d" stroke="#38bdf8" stroke-width="2"/>
  <path d="M916 260V246 M910 251l6-5 6 5"
        fill="none" stroke="#38bdf8" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text x="940" y="258" fill="#e0f2fe" font-family="Arial,sans-serif"
        font-size="17" font-weight="600">CONTROLLED</text>

  <!-- Connected security controls -->
  <path d="M768 289V310H870 M973 289V310H870V327"
        fill="none" stroke="#38bdf8" stroke-width="2.5"/>

  <rect x="676" y="327" width="120" height="66" rx="10" fill="#16384d"/>
  <rect x="810" y="327" width="120" height="66" rx="10" fill="#16384d"/>
  <rect x="944" y="327" width="124" height="66" rx="10" fill="#16384d"/>

  <g fill="#e0f2fe" font-family="Arial,sans-serif"
     font-size="16" font-weight="600" text-anchor="middle">
    <text x="736" y="355">MALWARE</text>
    <text x="736" y="376">SCANS</text>
    <text x="870" y="366">USB</text>
    <text x="1006" y="355">THREAT</text>
    <text x="1006" y="376">MONITORING</text>
  </g>

  <!-- Shield icon -->
  <path d="M1020 440l62 23v43c0 43-27 70-62 88-35-18-62-45-62-88v-43z"
        fill="#0c293d" stroke="#2dd4bf" stroke-width="4"/>
  <path d="M990 505l20 20 39-43" fill="none" stroke="#5eead4"
        stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Footer -->
  <path d="M64 540H1136" stroke="#477084" opacity=".65"/>
  <text x="66" y="578" fill="#9fbccc" font-family="Arial,sans-serif"
        font-size="17" letter-spacing="2">HITOP / STANDARD OPERATING PROCEDURE</text>
  <text x="1134" y="578" fill="#5eead4" font-family="Arial,sans-serif"
        font-size="17" font-weight="700" text-anchor="end">IT • SECURITY</text>
</svg>
