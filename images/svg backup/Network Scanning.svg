
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071426"/>
      <stop offset="100%" stop-color="#122d4b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#60a5fa" stroke-opacity=".08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="720" rx="24" fill="url(#grid)"/>
  <circle cx="1000" cy="335" r="250" fill="#0891b2" opacity=".07"/>

  <!-- Category badge -->
  <rect x="72" y="72" width="285" height="46" rx="23"
        fill="#102f4a" stroke="#22d3ee" stroke-opacity=".65"/>
  <circle cx="98" cy="95" r="6" fill="#22d3ee"/>
  <text x="117" y="102" font-family="Arial, sans-serif"
        font-size="18" font-weight="700" letter-spacing="2"
        fill="#7dd3fc">NETWORK SECURITY</text>

  <!-- Main title -->
  <text x="72" y="225" font-family="Arial, sans-serif"
        font-size="78" font-weight="900" fill="#ffffff">NETWORK</text>
  <text x="72" y="315" font-family="Arial, sans-serif"
        font-size="78" font-weight="900" fill="url(#cyan)">SCANNING</text>

  <rect x="77" y="347" width="130" height="6" rx="3" fill="#22d3ee"/>

  <text x="78" y="401" font-family="Arial, sans-serif"
        font-size="25" font-weight="700" fill="#e2e8f0">
    Discover Devices &amp; Services
  </text>
  <text x="78" y="441" font-family="Arial, sans-serif"
        font-size="22" fill="#a9c4df">
    Map your network. Identify open ports.
  </text>

  <!-- Terminal window -->
  <g transform="translate(78 490)">
    <rect width="490" height="116" rx="12"
          fill="#07101d" stroke="#28516c" stroke-width="2"/>
    <path d="M0 35H490" stroke="#28516c" stroke-width="2"/>
    <circle cx="21" cy="18" r="5" fill="#fb7185"/>
    <circle cx="40" cy="18" r="5" fill="#fbbf24"/>
    <circle cx="59" cy="18" r="5" fill="#4ade80"/>

    <text x="20" y="62" font-family="monospace"
          font-size="18" fill="#67e8f9">$ nmap -sV [authorized-target]</text>
    <text x="20" y="88" font-family="monospace"
          font-size="16" fill="#4ade80">Host discovery: complete</text>
    <text x="20" y="107" font-family="monospace"
          font-size="14" fill="#94a3b8">Scanning an authorized lab network</text>
  </g>

  <!-- Radar rings -->
  <g fill="none" stroke="#22d3ee" stroke-width="2" opacity=".65">
    <circle cx="960" cy="330" r="225" stroke-dasharray="7 11"/>
    <circle cx="960" cy="330" r="175" stroke-dasharray="4 9"/>
    <circle cx="960" cy="330" r="120"/>
    <path d="M735 330H1185 M960 105V555"/>
    <path d="M800 170L1120 490 M1120 170L800 490" opacity=".4"/>
  </g>

  <!-- Radar sweep -->
  <path d="M960 330L960 105A225 225 0 0 1 1185 330Z"
        fill="#22d3ee" opacity=".09"/>
  <path d="M960 330L1120 172"
        stroke="#67e8f9" stroke-width="4" filter="url(#glow)"/>

  <!-- Network connection lines -->
  <g fill="none" stroke="#60a5fa" stroke-width="3" opacity=".85">
    <path d="M960 330L835 235"/>
    <path d="M960 330L1090 225"/>
    <path d="M960 330L1125 380"/>
    <path d="M960 330L850 435"/>
    <path d="M960 330L970 490"/>
  </g>

  <!-- Network devices -->
  <g stroke="#7dd3fc" stroke-width="3">
    <!-- Router -->
    <g transform="translate(910 290)">
      <rect width="100" height="80" rx="12" fill="#153c5a"/>
      <rect x="14" y="17" width="72" height="36" rx="5" fill="#082638"/>
      <path d="M27 32H73 M27 42H58" stroke="#22d3ee" stroke-width="3"/>
      <circle cx="23" cy="64" r="3" fill="#4ade80" stroke="none"/>
      <circle cx="34" cy="64" r="3" fill="#4ade80" stroke="none"/>
    </g>

    <!-- Device icon: computer -->
    <g transform="translate(795 202)">
      <rect width="62" height="43" rx="5" fill="#153c5a"/>
      <rect x="7" y="7" width="48" height="28" rx="2" fill="#0e7490"/>
      <path d="M31 43V51 M19 51H43" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Server -->
    <g transform="translate(1065 190)">
      <rect width="53" height="72" rx="6" fill="#153c5a"/>
      <rect x="8" y="9" width="37" height="14" rx="2" fill="#082638"/>
      <rect x="8" y="29" width="37" height="14" rx="2" fill="#082638"/>
      <rect x="8" y="49" width="37" height="14" rx="2" fill="#082638"/>
      <circle cx="15" cy="16" r="2.5" fill="#4ade80" stroke="none"/>
      <circle cx="15" cy="36" r="2.5" fill="#4ade80" stroke="none"/>
      <circle cx="15" cy="56" r="2.5" fill="#4ade80" stroke="none"/>
    </g>

    <!-- Laptop -->
    <g transform="translate(1090 370)">
      <rect width="65" height="43" rx="5" fill="#153c5a"/>
      <rect x="6" y="6" width="53" height="29" rx="2" fill="#0e7490"/>
      <path d="M-6 47H71L64 54H1Z" fill="#153c5a"/>
    </g>

    <!-- Desktop -->
    <g transform="translate(820 415)">
      <rect width="60" height="43" rx="5" fill="#153c5a"/>
      <rect x="7" y="7" width="46" height="28" rx="2" fill="#0e7490"/>
      <path d="M30 43V51 M18 51H42" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Mobile device -->
    <g transform="translate(950 465)">
      <rect width="37" height="60" rx="7" fill="#153c5a"/>
      <rect x="5" y="8" width="27" height="40" rx="3" fill="#0e7490"/>
      <circle cx="18.5" cy="54" r="2" fill="#7dd3fc" stroke="none"/>
    </g>
  </g>

  <!-- Scan indicators -->
  <g fill="#4ade80" filter="url(#glow)">
    <circle cx="835" cy="235" r="6"/>
    <circle cx="1090" cy="225" r="6"/>
    <circle cx="1125" cy="380" r="6"/>
    <circle cx="850" cy="435" r="6"/>
    <circle cx="970" cy="490" r="6"/>
  </g>

  <!-- Footer -->
  <path d="M72 638H1208" stroke="#60a5fa" stroke-opacity=".25"/>
  <text x="75" y="678" font-family="Arial, sans-serif"
        font-size="23" font-weight="800" letter-spacing="3"
        fill="#22d3ee">HITOP</text>
  <text x="1205" y="677" text-anchor="end"
        font-family="Arial, sans-serif" font-size="18"
        fill="#a9c4df">DISCOVER • ANALYZE • SECURE</text>
</svg>
