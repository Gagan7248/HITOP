<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Block a Website URL on FortiGate</title>
  <desc id="desc">FortiGate firewall blocking a website through URL filtering and web security policies.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#edf3ff"/>
      <stop offset="100%" stop-color="#d8e5fa"/>
    </linearGradient>

    <linearGradient id="firewall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3569b8"/>
      <stop offset="100%" stop-color="#183e7a"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7"
                    flood-color="#244a80" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="24" fill="url(#bg)"/>
  <circle cx="400" cy="220" r="170" fill="#ffffff" opacity="0.28"/>

  <!-- Browser Window -->
  <g filter="url(#shadow)">
    <rect x="55" y="70" width="405" height="255" rx="16"
          fill="#ffffff" stroke="#4263a5" stroke-width="5"/>

    <!-- Browser Header -->
    <path d="M55 120 H460" stroke="#4263a5" stroke-width="4"/>
    <circle cx="78" cy="95" r="6" fill="#4263a5"/>
    <circle cx="98" cy="95" r="6" fill="#7898ce"/>
    <circle cx="118" cy="95" r="6" fill="#b5c8e8"/>

    <!-- URL Address Bar -->
    <rect x="145" y="82" width="295" height="26" rx="7"
          fill="#edf3ff" stroke="#b5c8e8" stroke-width="2"/>

    <circle cx="160" cy="95" r="4" fill="#4263a5"/>
    <path d="M170 95 H195" stroke="#4263a5" stroke-width="3"
          stroke-linecap="round"/>
    <path d="M205 95 H265" stroke="#7898ce" stroke-width="3"
          stroke-linecap="round"/>

    <!-- Website Content -->
    <rect x="80" y="145" width="185" height="13" rx="6" fill="#4263a5"/>
    <rect x="80" y="174" width="320" height="9" rx="4" fill="#c7d6ee"/>
    <rect x="80" y="194" width="285" height="9" rx="4" fill="#c7d6ee"/>
    <rect x="80" y="214" width="245" height="9" rx="4" fill="#c7d6ee"/>

    <!-- Blocked Website Message -->
    <rect x="80" y="250" width="355" height="48" rx="9" fill="#fff0f0"/>
    <circle cx="105" cy="274" r="13" fill="#d93645"/>
    <path d="M99 268 L111 280 M111 268 L99 280"
          stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="127" y="271" font-family="Arial, sans-serif"
          font-size="13" font-weight="700" fill="#b42332">URL BLOCKED</text>
    <text x="127" y="286" font-family="Arial, sans-serif"
          font-size="10" fill="#8c3440">Access denied by web filter</text>
  </g>

  <!-- Connection Path -->
  <path d="M460 200 H505" fill="none" stroke="#4263a5"
        stroke-width="5" stroke-linecap="round" stroke-dasharray="7 8"/>

  <!-- Blocking Symbol -->
  <circle cx="485" cy="200" r="23" fill="#ffffff" stroke="#d93645" stroke-width="4"/>
  <path d="M475 190 L495 210 M495 190 L475 210"
        stroke="#d93645" stroke-width="5" stroke-linecap="round"/>

  <!-- FortiGate Firewall -->
  <g filter="url(#shadow)">
    <rect x="505" y="140" width="245" height="145" rx="15"
          fill="url(#firewall)"/>

    <!-- Appliance Top Edge -->
    <path d="M520 140 H735 L750 157 H535 Z" fill="#5483cb"/>

    <!-- FortiGate Symbol -->
    <g transform="translate(530 178)" fill="#ffffff">
      <rect x="0" y="0" width="13" height="13" rx="2"/>
      <rect x="17" y="0" width="13" height="13" rx="2"/>
      <rect x="34" y="0" width="13" height="13" rx="2"/>
      <rect x="0" y="17" width="13" height="13" rx="2"/>
      <rect x="34" y="17" width="13" height="13" rx="2"/>
      <rect x="0" y="34" width="13" height="13" rx="2"/>
      <rect x="17" y="34" width="13" height="13" rx="2"/>
      <rect x="34" y="34" width="13" height="13" rx="2"/>
    </g>

    <text x="588" y="200" font-family="Arial, sans-serif"
          font-size="22" font-weight="700" fill="#ffffff">FortiGate</text>

    <!-- Firewall Label -->
    <text x="530" y="245" font-family="Arial, sans-serif"
          font-size="12" font-weight="600" fill="#dbe8ff">WEB FILTER</text>

    <rect x="530" y="255" width="150" height="5" rx="2.5"
          fill="#8fb5ed"/>

    <!-- Status Indicators -->
    <circle cx="710" cy="235" r="5" fill="#72e3a1"/>
    <circle cx="710" cy="253" r="5" fill="#72e3a1"/>
    <circle cx="710" cy="271" r="5" fill="#72e3a1"/>
  </g>

  <!-- Security Badge -->
  <g transform="translate(630 65)">
    <path d="M0 0 L32 11 V34 C32 53 19 65 0 73 C-19 65 -32 53 -32 34 V11 Z"
          fill="#ffffff" stroke="#4263a5" stroke-width="4"/>
    <path d="M-13 34 L-3 44 L16 23"
          fill="none" stroke="#4263a5" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Footer Label -->
  <rect x="205" y="365" width="390" height="43" rx="12"
        fill="#ffffff" stroke="#c2d3ee" stroke-width="2"/>

  <text x="400" y="383" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="12"
        font-weight="700" fill="#244a80">FORTIGATE URL FILTERING</text>

  <text x="400" y="398" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="10"
        fill="#58749e">Block unwanted websites with firewall policies</text>
</svg>