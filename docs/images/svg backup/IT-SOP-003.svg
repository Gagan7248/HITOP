
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="630"
     viewBox="0 0 1200 630">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101F35"/>
      <stop offset="100%" stop-color="#183D50"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#32B9A8"/>
      <stop offset="100%" stop-color="#76D6C3"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#80C9C6" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#80C9C6" stop-opacity=".04"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle hotel architecture -->
  <g opacity=".16" fill="none" stroke="#A7D8D5"
     stroke-width="2">
    <path d="M700 0 V630 M1200 0 V630"/>
    <path d="M740 0 L740 630 M1150 0 L1150 630"/>
    <path d="M780 0 H1200"/>
    <path d="M780 180 H1200"/>
    <path d="M780 360 H1200"/>
    <path d="M780 540 H1200"/>
  </g>

  <!-- Hotel building silhouette -->
  <g opacity=".20">
    <path d="M850 170 H1090 V500 H850 Z"
          fill="#B4D9D5"/>
    <path d="M820 170 L970 85 L1120 170 Z"
          fill="#B4D9D5"/>
    <g fill="#16354A">
      <rect x="880" y="205" width="35" height="45"/>
      <rect x="950" y="205" width="35" height="45"/>
      <rect x="1020" y="205" width="35" height="45"/>
      <rect x="880" y="285" width="35" height="45"/>
      <rect x="950" y="285" width="35" height="45"/>
      <rect x="1020" y="285" width="35" height="45"/>
      <rect x="880" y="365" width="35" height="45"/>
      <rect x="1020" y="365" width="35" height="45"/>
      <rect x="950" y="420" width="45" height="80"/>
    </g>
  </g>

  <!-- Decorative floor line -->
  <path d="M0 540 H1200" stroke="#6BC7B9"
        stroke-opacity=".18" stroke-width="2"/>

  <!-- Branding -->
  <g transform="translate(75 65)">
    <rect width="42" height="42" rx="10"
          fill="url(#accent)"/>
    <path d="M11 30 V13 H19 L26 21 L33 13 V30"
          fill="none" stroke="#10283A"
          stroke-width="3" stroke-linejoin="round"/>
    <text x="57" y="18" fill="#FFFFFF"
          font-family="Arial, sans-serif"
          font-size="17" font-weight="700"
          letter-spacing="2">HOTEL IT</text>
    <text x="57" y="39" fill="#9FC6CC"
          font-family="Arial, sans-serif"
          font-size="12" letter-spacing="3">SOP LIBRARY</text>
  </g>

  <!-- SOP number -->
  <g transform="translate(75 175)">
    <rect width="145" height="39" rx="19"
          fill="#2AAB9B"/>
    <text x="72" y="26" text-anchor="middle"
          fill="#FFFFFF"
          font-family="Arial, sans-serif"
          font-size="17" font-weight="700"
          letter-spacing="1">IT-SOP-003</text>
  </g>

  <!-- Main title -->
  <g font-family="Arial, sans-serif"
     font-weight="700" fill="#FFFFFF">

    <text x="75" y="280" font-size="46">
      HOTEL SOFTWARE
    </text>

    <text x="75" y="340" font-size="46">
      USER ACCOUNT
    </text>

    <text x="75" y="400" font-size="46">
      MANAGEMENT
    </text>

    <text x="75" y="455" font-size="34">
      SOP
    </text>
  </g>

  <!-- Accent line -->
  <rect x="75" y="475" width="100" height="5"
        rx="2.5" fill="url(#accent)"/>

  <!-- Subtitle -->
  <text x="75" y="515" fill="#B9D4DA"
        font-family="Arial, sans-serif"
        font-size="16" letter-spacing="1">
    CREATION • MODIFICATION • DEACTIVATION
  </text>

  <!-- User Account Management Illustration -->
  <g transform="translate(820 195)">

    <!-- Main access management panel -->
    <rect x="0" y="0" width="290" height="225"
          rx="15" fill="#102A40"
          stroke="#65C9B8" stroke-width="3"/>

    <rect x="14" y="14" width="262" height="197"
          rx="8" fill="#F0F6F5"/>

    <!-- Header -->
    <rect x="14" y="14" width="262" height="34"
          rx="7" fill="#21475A"/>

    <circle cx="30" cy="31" r="5" fill="#70D4C0"/>
    <rect x="44" y="27" width="100" height="7"
          rx="3" fill="#D1E5E4"/>

    <!-- User profile icon -->
    <circle cx="68" cy="91" r="25"
            fill="#D9EAE9"/>
    <circle cx="68" cy="83" r="9"
            fill="#279C91"/>
    <path d="M50 108 Q68 88 86 108"
          fill="#279C91"/>

    <!-- User details -->
    <g fill="#B7D5D2">
      <rect x="108" y="69" width="115" height="8" rx="4"/>
      <rect x="108" y="85" width="88" height="6" rx="3"/>
      <rect x="108" y="101" width="105" height="6" rx="3"/>
    </g>

    <!-- Permission management rows -->
    <g fill="#D9EAE9">
      <rect x="30" y="130" width="230" height="22" rx="5"/>
      <rect x="30" y="159" width="230" height="22" rx="5"/>
      <rect x="30" y="188" width="230" height="12" rx="4"/>
    </g>

    <!-- Status indicators -->
    <circle cx="243" cy="141" r="6" fill="#279C91"/>
    <circle cx="243" cy="170" r="6" fill="#279C91"/>

    <!-- Checkmark -->
    <path d="M232 170 L240 177 L253 160"
          fill="none" stroke="#FFFFFF"
          stroke-width="2.5" stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Floating security shield -->
    <g transform="translate(215 -38)">
      <path d="M35 0 L67 12 V34
               Q67 59 35 76
               Q3 59 3 34 V12 Z"
            fill="#2AAB9B"
            stroke="#76D6C3" stroke-width="2"/>
      <path d="M20 37 L30 47 L50 26"
            fill="none" stroke="#FFFFFF"
            stroke-width="5" stroke-linecap="round"
            stroke-linejoin="round"/>
    </g>

    <!-- Small user creation icon -->
    <g transform="translate(-30 145)">
      <circle cx="23" cy="23" r="23"
              fill="#2AAB9B"/>
      <circle cx="19" cy="16" r="7"
              fill="#FFFFFF"/>
      <path d="M8 34 Q19 22 30 34"
            fill="#FFFFFF"/>
      <path d="M35 19 V35 M27 27 H43"
            stroke="#FFFFFF" stroke-width="3"
            stroke-linecap="round"/>
    </g>

    <!-- Account deactivation icon -->
    <g transform="translate(250 185)">
      <circle cx="18" cy="18" r="18"
              fill="#2AAB9B"/>
      <path d="M9 18 H27"
            stroke="#FFFFFF" stroke-width="4"
            stroke-linecap="round"/>
    </g>

  </g>

  <!-- Bottom branding -->
  <text x="75" y="585" fill="#86AEB8"
        font-family="Arial, sans-serif"
        font-size="14" letter-spacing="2">
    HOTEL IT OPERATIONS &amp; MANAGEMENT
  </text>

</svg>
